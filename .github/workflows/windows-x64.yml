name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-x64-v1.3.5
      - ads-local-v1.4.1
    paths:
      - "main.cpp"
      - "ads/**"
      - "CMakeLists.txt"
      - ".github/workflows/windows-x64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/Release/PC_Performance_Monitor_v1_4_1_x64.exe"
          if (!(Test-Path $exe)) { throw "Executable was not produced: $exe" }
          $item = Get-Item $exe
          Write-Host "EXE size: $($item.Length) bytes"
          if ($item.Length -lt 10000) { throw "Executable size is unexpectedly small." }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Performance-Monitor-v1.4.1-Windows-x64
          path: |
            build/Release/PC_Performance_Monitor_v1_4_1_x64.exe
            build/Release/PC_Performance_Monitor_AdServer_x64.exe
          if-no-files-found: error
